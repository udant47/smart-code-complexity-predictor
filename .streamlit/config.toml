[theme]
base = "dark"
primaryColor = "#5b9cf5"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#141a22"
textColor = "#e6edf3"
font = "sans serif"

[client]
# Never show Python tracebacks in the page; errors are logged in the terminal instead.
showErrorDetails = false
toolbarMode = "minimal"

[server]
# No address or port here: Streamlit Community Cloud sets them itself, and a fixed "localhost" can make the
# cloud health check fail. For local use, run with --server.address localhost (see README, "Running the
# application") so the app is reachable from this computer only.
# 1 MB upload/message limit is plenty: the analyzer accepts up to 200 KB of code.
maxUploadSize = 1
runOnSave = false

[browser]
gatherUsageStats = false
